<script>
(function () {
  var FID = "08-step2-dataset";
  var $ = function (s) { return document.getElementById("f08-step2-dataset-" + s); };
  var CW = 16.8;   // JetBrains Mono advance at 28px (0.6em)
  var WW = 1110;   // wipe window width

  // a typer the timeline drives (file names on the paper)
  function typer(el, text) {
    var n = text.length;
    return function (p) { el.textContent = text.slice(0, Math.floor(p * n + 1e-6)); };
  }
  var typers = [];
  for (var i = 1; i <= 7; i++) { var el = $("n" + i); typers.push(typer(el, el.textContent)); typers[i - 1](0); }

  // initial states, outside the timeline
  gsap.set([$("p3"), $("p4"), $("p5")], { opacity: 0, y: 8 });
  gsap.set([$("u3"), $("u4"), $("u5"), $("g3"), $("g4"), $("g5")], { scaleX: 0 });
  gsap.set($("L6"), { opacity: 0 });
  gsap.set([$("a3"), $("a4"), $("a5")], { opacity: 0 });
  ["W3", "W4", "W5"].forEach(function (w) { gsap.set($(w), { x: -WW }); });
  ["L3", "L4", "L5"].forEach(function (l) { gsap.set($(l), { x: WW }); });
  gsap.set([$("k1"), $("k2")], { opacity: 0 });

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  // Scene 1 (0–8s): the anchor, then seven files type down, each with its plain word
  tl.fromTo($("place"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.066);
  var starts = [0.6, 1.5, 2.4, 3.3, 4.2, 5.4, 6.4];
  starts.forEach(function (t0, i) {
    var d = { p: 0 }, T = typers[i];
    tl.to(d, { p: 1, duration: 0.5, ease: "none", onUpdate: function () { T(d.p); } }, t0);
    tl.fromTo($("d" + (i + 1)), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, t0 + 0.5);
  });

  // Scene 2 (8–20s): songs.json opens on the slab; the record types, then three new fields wipe in
  tl.fromTo($("ful"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 5.37);
  tl.fromTo($("slab"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.436);
  var lines = [[29, 8.8, 1.0], [25, 10.0, 0.9]];
  lines.forEach(function (L, i) {
    var n = i + 1;
    tl.set($("k" + n), { opacity: 1 }, L[1] - 0.2);
    tl.fromTo($("v" + n), { x: 0 }, { x: L[0] * CW, duration: L[2], ease: "steps(" + L[0] + ")" }, L[1]);
    tl.set($("v" + n), { opacity: 0 }, L[1] + L[2] + 0.15);
  });
  // each added field: sign, wipe, then its pinned word rises and its underline draws
  [["3", 11.6], ["4", 12.9], ["5", 14.2]].forEach(function (f) {
    var n = f[0], t = f[1];
    tl.to($("a" + n), { opacity: 1, duration: 0.2, ease: "none" }, t);
    tl.to($("W" + n), { x: 0, duration: 0.7, ease: "power2.inOut" }, t);
    tl.to($("L" + n), { x: 0, duration: 0.7, ease: "power2.inOut" }, t);
    tl.to($("p" + n), { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t + 0.8);
    tl.to($("u" + n), { scaleX: 1, duration: 0.4, ease: "power1.inOut" }, t + 0.85);
    tl.to($("g" + n), { scaleX: 1, duration: 0.3, ease: "power3.out" }, t + 0.7);
  });
  // the record closes once the lyrics line is in (all done by ~15.5s; the scene rests after)
  tl.to($("L6"), { opacity: 1, duration: 0.3, ease: "power3.out" }, 14.9);

  // Scene 3 (20–26s): the note under the slab, then hold
  tl.fromTo($("note"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 13.524);
  tl.to({ hold: 0 }, { hold: 1, duration: 0.001 }, 25.99);

  window.__timelines[FID] = tl;
})();
</script>
