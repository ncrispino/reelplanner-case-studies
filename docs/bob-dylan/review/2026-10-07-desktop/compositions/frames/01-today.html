<script>
(function () {
  var FID = "01-today";
  var E = "power3.out";
  var $ = function (s) { return document.getElementById("f01-today-" + s); };
  var pop = function (tl, el, at, d) { tl.fromTo(el, { opacity: 0, y: d == null ? 12 : d }, { opacity: 1, y: 0, duration: 0.5, ease: E }, at); };
  var fade = function (tl, el, at, d) { tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d || 0.5, ease: E }, at); };

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  // Scene 1 (0-7.6s): the window pushes in; 1440 px, then the 720 px column and the empty sides

  tl.fromTo($("win"), { opacity: 0, y: 36, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: E }, 0.18);

  pop(tl, $("wchip"), 1.05, 6);                          // "computer"

  pop(tl, $("cchip"), 4.0, 6);                           // "720"

  fade(tl, $("shr"), 6.2, 0.6);

  tl.fromTo($("quote"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 7.6);   // "This plan"

  tl.set({}, {}, 11.52);
  window.__timelines[FID] = tl;
})();
