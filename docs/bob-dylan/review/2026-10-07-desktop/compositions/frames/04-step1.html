    <svg class="f04-step1-svg" viewBox="0 0 1920 900" aria-hidden="true">

<script>
(function () {
  var FID = "04-step1";
  var E = "power3.out";
  var $ = function (s) { return document.getElementById("f04-step1-" + s); };
  var pop = function (tl, el, at, d) { tl.fromTo(el, { opacity: 0, y: d == null ? 12 : d }, { opacity: 1, y: 0, duration: 0.5, ease: E }, at); };
  var fade = function (tl, el, at, d) { tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d || 0.35, ease: E }, at); };
  var node = function (tl, el, at) { tl.fromTo(el, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: E }, at); };
  var draw = function (tl, el, at, len) { tl.fromTo(el, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, at); };

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  // Scene 1 (0-11.1s): the map crop; the pointer on Nottamun Town presses; the "today" line, struck through
  pop(tl, $("place"), 0.169, 8);
  tl.fromTo($("win"), { opacity: 0, y: 30, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: E }, 0.24);
  pop(tl, $("title"), 0.601, 10);
  tl.fromTo($("ptr"), { opacity: 0, x: 60, y: 50 }, { opacity: 1, x: 0, y: 0, duration: 0.6, ease: E }, 1.804);     // "grabs the pointer"
  pop(tl, $("today"), 2.406, 8);
  tl.fromTo($("ptrp"), { scale: 1, svgOrigin: "0 0" }, { scale: 0.86, duration: 0.1, ease: "power2.out", immediateRender: false }, 3.537);   // "press"
  tl.to($("ptrp"), { scale: 1, duration: 0.15, ease: "power2.out" }, 3.669);
  tl.fromTo($("ring"), { opacity: 0, scale: 0.3, svgOrigin: "438 490" }, { opacity: 1, scale: 1, duration: 0.35, ease: E }, 3.561);
  tl.to($("ring"), { opacity: 0, duration: 0.5, ease: "power2.out" }, 4.002);                              // a pulse, then gone off the label
  tl.fromTo($("strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: E }, 11.298);                            // "broken"

  // Scene 2 (11.1-16.4s): the diagram draws node by node; "song opens" turns coral; hold
  node(tl, $("n1"), 13.379);                                                                                     // "Now"
  draw(tl, $("e2"), 15.64, 420); fade(tl, $("a2"), 16.121); pop(tl, $("l2"), 15.786, 6);                           // "move 4 pixels"
  node(tl, $("n3"), 16.351);
  draw(tl, $("e1"), 17.566, 420); fade(tl, $("a1"), 18.047); pop(tl, $("l1"), 17.637, 6);                           // "press and release"
  node(tl, $("n2"), 18.047);
  tl.fromTo($("hot"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: E }, 18.553);                          // "opens the song": the one coral

  tl.set({}, {}, 19.711);
  window.__timelines[FID] = tl;
})();
</script>
